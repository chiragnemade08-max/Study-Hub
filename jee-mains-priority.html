<!DOCTYPE html>
<html lang="en">

<head> 

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEE Main • Coming Soon</title>

<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


/* =========================
   BODY
========================= */

body{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

overflow:hidden;

background:#f4f7ff;

color:#111827;

transition:
background .4s,
color .4s;

}


/* =========================
   ANIMATED BACKGROUND
========================= */

body::before{

content:"";

position:fixed;

width:360px;

height:360px;

border-radius:50%;

background:#2563eb;

filter:blur(130px);

top:-150px;

left:-150px;

opacity:.25;

z-index:-2;

animation:
floatOne 7s ease-in-out infinite alternate;

}


body::after{

content:"";

position:fixed;

width:360px;

height:360px;

border-radius:50%;

background:#9333ea;

filter:blur(130px);

right:-150px;

bottom:-150px;

opacity:.22;

z-index:-2;

animation:
floatTwo 8s ease-in-out infinite alternate;

}


@keyframes floatOne{

from{
transform:translate(0,0);
}

to{
transform:translate(70px,50px);
}

}


@keyframes floatTwo{

from{
transform:translate(0,0);
}

to{
transform:translate(-60px,-60px);
}

}


/* =========================
   CONTAINER
========================= */

.container{

width:100%;

max-width:450px;

}


/* =========================
   TOP BAR
========================= */

.topbar{

display:flex;

justify-content:flex-end;

margin-bottom:15px;

}


.theme-btn{

width:52px;

height:52px;

border:0;

border-radius:18px;

background:rgba(255,255,255,.92);

font-size:23px;

cursor:pointer;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

transition:.3s;

}


.theme-btn:hover{

transform:
translateY(-4px)
scale(1.04);

}


/* =========================
   MAIN CARD
========================= */

.card{

position:relative;

overflow:hidden;

padding:42px 25px;

border-radius:36px;

text-align:center;

background:
rgba(255,255,255,.90);

border:
1px solid rgba(255,255,255,.7);

box-shadow:
0 25px 60px rgba(37,99,235,.16);

backdrop-filter:blur(15px);

}


/* Decorative circles */

.card::before{

content:"";

position:absolute;

width:190px;

height:190px;

border-radius:50%;

background:#dbeafe;

right:-100px;

top:-100px;

opacity:.7;

}


.card::after{

content:"";

position:absolute;

width:150px;

height:150px;

border-radius:50%;

background:#ede9fe;

left:-90px;

bottom:-80px;

opacity:.7;

}


/* =========================
   CONTENT
========================= */

.content{

position:relative;

z-index:2;

}


/* =========================
   ICON
========================= */

.icon{

width:90px;

height:90px;

margin:0 auto 22px;

display:flex;

align-items:center;

justify-content:center;

border-radius:28px;

font-size:48px;

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);

box-shadow:
0 15px 35px rgba(79,70,229,.30);

animation:
iconFloat 3s ease-in-out infinite;

}


@keyframes iconFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}


/* =========================
   TITLE
========================= */

.small-title{

font-size:13px;

font-weight:800;

letter-spacing:2px;

color:#7c3aed;

margin-bottom:9px;

text-transform:uppercase;

}


.title{

font-size:38px;

font-weight:900;

letter-spacing:-1px;

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed,
#9333ea
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}


.coming{

font-size:31px;

font-weight:900;

margin-top:4px;

color:#111827;

}


/* =========================
   DESCRIPTION
========================= */

.description{

font-size:14px;

line-height:1.8;

color:#6b7280;

margin:18px auto 0;

max-width:340px;

}


/* =========================
   BADGE
========================= */

.badge{

display:inline-flex;

align-items:center;

gap:8px;

margin-top:25px;

padding:11px 17px;

border-radius:30px;

font-size:12px;

font-weight:800;

color:#4f46e5;

background:#eef2ff;

border:
1px solid #e0e7ff;

}


.dot{

width:8px;

height:8px;

border-radius:50%;

background:#7c3aed;

animation:pulse 1.4s infinite;

}


@keyframes pulse{

0%{
box-shadow:0 0 0 0 rgba(124,58,237,.5);
}

70%{
box-shadow:0 0 0 8px rgba(124,58,237,0);
}

100%{
box-shadow:0 0 0 0 rgba(124,58,237,0);
}

}


/* =========================
   FEATURES
========================= */

.features{

display:flex;

gap:9px;

margin-top:27px;

}


.feature{

flex:1;

padding:13px 7px;

border-radius:17px;

background:#f5f7ff;

}


.feature-icon{

font-size:20px;

margin-bottom:5px;

}


.feature-text{

font-size:10px;

font-weight:800;

color:#6b7280;

}


/* =========================
   FOOTER
========================= */

.footer{

margin-top:20px;

font-size:11px;

color:#9ca3af;

}


.footer strong{

color:#7c3aed;

}


/* =========================
   DARK MODE
========================= */

body.dark{

background:#0b1120;

color:#f9fafb;

}


body.dark .card{

background:
rgba(24,34,53,.92);

border-color:
rgba(255,255,255,.05);

box-shadow:
0 25px 60px rgba(0,0,0,.30);

}


body.dark .theme-btn{

background:#182235;

color:white;

}


body.dark .coming{

color:#f9fafb;

}


body.dark .description,
body.dark .footer{

color:#9ca3af;

}


body.dark .feature{

background:#0f172a;

}


body.dark .feature-text{

color:#9ca3af;

}


body.dark .badge{

background:#172554;

border-color:#1e3a8a;

color:#93c5fd;

}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

.card{

padding:35px 20px;

border-radius:30px;

}


.icon{

width:78px;

height:78px;

font-size:40px;

}


.title{

font-size:32px;

}


.coming{

font-size:27px;

}


.description{

font-size:13px;

}

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     THEME
========================= -->

<div class="topbar">

<button
class="theme-btn"
id="themeToggle">

🌙

</button>

</div>


<!-- =========================
     MAIN CARD
========================= -->

<div class="card">


<div class="content">


<!-- ICON -->

<div class="icon">

🚀

</div>


<!-- TITLE -->

<div class="small-title">

STUDY-HUB

</div>


<div class="title">

JEE Main

</div>


<div class="coming">

Coming Soon!!!

</div>


<!-- DESCRIPTION -->

<div class="description">

We're working on something exciting
for JEE Main aspirants. Detailed
chapter-wise resources, question
weightage and preparation content
will be available soon.

</div>


<!-- BADGE -->

<div class="badge">

<span class="dot"></span>

CONTENT IN DEVELOPMENT

</div>


<!-- FEATURES -->

<div class="features">


<div class="feature">

<div class="feature-icon">
📚
</div>

<div class="feature-text">
CHAPTERS
</div>

</div>


<div class="feature">

<div class="feature-icon">
📊
</div>

<div class="feature-text">
WEIGHTAGE
</div>

</div>


<div class="feature">

<div class="feature-icon">
🎯
</div>

<div class="feature-text">
JEE MAIN
</div>

</div>


</div>


<!-- FOOTER -->

<div class="footer">

More from <strong>STUDY-HUB</strong> • Stay tuned 🚀

</div>


</div>

</div>


</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>


const themeToggle =
document.getElementById("themeToggle");


themeToggle.addEventListener(
"click",
function(){

document.body.classList.toggle("dark");


if(
document.body.classList.contains("dark")
){

themeToggle.innerText="☀️";

localStorage.setItem(
"theme",
"dark"
);

}

else{

themeToggle.innerText="🌙";

localStorage.setItem(
"theme",
"light"
);

}

});


/* Remember theme */

if(
localStorage.getItem("theme")
===
"dark"
){

document.body.classList.add("dark");

themeToggle.innerText="☀️";

}

else{

themeToggle.innerText="🌙";

}

</script>


</body>

</html>
